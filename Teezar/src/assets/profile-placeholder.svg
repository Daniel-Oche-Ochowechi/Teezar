<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="50%" stop-color="#0B0B0C" />
      <stop offset="100%" stop-color="#18181D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD292" />
      <stop offset="40%" stop-color="#D4B260" />
      <stop offset="70%" stop-color="#AA8338" />
      <stop offset="100%" stop-color="#DFBE7A" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A245" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FAF0D8" stop-opacity="1" />
      <stop offset="100%" stop-color="#AA8338" stop-opacity="0.7" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Atelier Outer Canvas -->
  <circle cx="150" cy="150" r="148" fill="url(#bgGrad)" stroke="url(#goldRing)" stroke-width="2.5" />
  
  <!-- Inner Delicate Golden Orbit Rings -->
  <circle cx="150" cy="150" r="138" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="4 3" opacity="0.6" />
  <circle cx="150" cy="150" r="128" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8" />

  <!-- Atelier Needle & Thread / Fashion Diamond Icon Motif -->
  <g transform="translate(150, 86) scale(0.9)">
    <polygon points="0,-16 12,0 0,16 -12,0" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" />
    <circle cx="0" cy="0" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Luxury Monogram "T" and "F" -->
  <text x="150" y="172" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
        font-size="82" 
        font-weight="500" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        letter-spacing="2"
        filter="url(#goldGlow)">
    TF
  </text>

  <!-- Brand Subtext -->
  <text x="150" y="206" 
        font-family="'Raleway', 'Inter', sans-serif" 
        font-size="10.5" 
        font-weight="700" 
        text-anchor="middle" 
        fill="#EBD292" 
        letter-spacing="5.5" 
        opacity="0.95">
    TEEZAR
  </text>

  <text x="150" y="222" 
        font-family="'Raleway', 'Inter', sans-serif" 
        font-size="8" 
        font-weight="500" 
        text-anchor="middle" 
        fill="#FAF0D8" 
        letter-spacing="4" 
        opacity="0.75">
    HAUTE COUTURE
  </text>

  <!-- Lower Diamond Accent -->
  <g transform="translate(150, 246) scale(0.6)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="url(#goldGrad)" />
  </g>
</svg>
